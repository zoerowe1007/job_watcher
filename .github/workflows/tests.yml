name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install -r requirements.txt
      - name: Run the test suite
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check that the Market page's JavaScript agrees with the Python reference
        run: node tests/market_check.mjs
