name: probe sources

# Setup helper: tries the employer job boards listed in tools/candidates.json and
# commits what answered to data/probe.json. Run it by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe.py
      - name: Commit the result
        run: |
          git config user.name "job-watcher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe.json
          git diff --cached --quiet || git commit -m "Probe result: which job boards answer"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push
