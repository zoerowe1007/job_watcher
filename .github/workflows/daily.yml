name: daily run

on:
  schedule:
    - cron: "17 8 * * *"     # every day at 08:17 UTC
  workflow_dispatch:          # lets me run it by hand; a second run on the same day replaces that day

permissions:
  contents: write             # commit the raw, history and status files
  issues: write               # the daily Issue
  pages: write                # ask Pages to rebuild after the commit

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the pipeline (fetch, history, status, Issue)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m watcher.run
      - name: Commit the raw files, history and status
        run: |
          git config user.name "job-watcher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/history.csv data/status.json data/run_log.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Daily run $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
      - name: Ask GitHub Pages to rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
